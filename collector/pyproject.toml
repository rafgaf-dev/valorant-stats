[project]
name = "valorant-stats-collector"
version = "0.1.0"
description = "Scheduled Lambda that imports Valorant matches and publishes stat summaries."
requires-python = ">=3.13"
# Runtime code uses only the standard library and the boto3 bundled with the Lambda runtime.
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "PT",  # flake8-pytest-style
  "RUF", # ruff-specific rules
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]

[tool.coverage.run]
source = ["collector"]
branch = true
