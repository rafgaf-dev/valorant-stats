version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      frontend-dev:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /collector
    schedule:
      interval: monthly
    groups:
      collector-dev:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: /infrastructure
    schedule:
      interval: monthly
