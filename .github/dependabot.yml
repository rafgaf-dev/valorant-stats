version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      # React packages must move together; a lone react or react-dom bump can't install.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      frontend-dev:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Types must match the Node.js runtime in .nvmrc; bump both together by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8 supports TypeScript < 6.1; revisit when it supports 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /collector
    schedule:
      interval: monthly
    groups:
      collector-dev:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: /infrastructure
    schedule:
      interval: monthly
